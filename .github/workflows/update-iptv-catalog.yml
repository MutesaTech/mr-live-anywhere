name: Update IPTV catalog

on:
  schedule:
    - cron: '0 4 * * 0' # weekly, Sunday 04:00 UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild catalog from iptv-org (with stream health checks)
        run: node scripts/build-iptv-channels.mjs --check --region=github-actions-us
      - name: Commit only when the catalog actually changed
        run: |
          if [ -n "$(git status --porcelain src/data/iptv-channels.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/iptv-channels.json
            git commit -m "chore(data): refresh IPTV catalog"
            git push
          else
            echo "No changes."
          fi
